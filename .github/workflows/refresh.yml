name: Refresh episodes and publish

on:
  push:
    branches: [main]
  schedule:
    # Twice a day, ~6:23am and ~2:23pm Pacific. GitHub sometimes skips a scheduled
    # run when it's busy, so the second run is a backup; it also gives Spotify
    # matching a second chance each day.
    - cron: "23 13 * * *"
    - cron: "23 21 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-read every episode page"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update episode list
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python scripts/scrape.py ${{ inputs.full && '--full' || '' }}

      - name: Save episode list to the repo
        run: |
          git config user.name "tal-archive-bot"
          git config user.email "tal-archive-bot@users.noreply.github.com"
          git add episodes.json details collections.json spotify-cache.json spotify-state.json 2>/dev/null || git add episodes.json details collections.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update episode list"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
