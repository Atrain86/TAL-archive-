<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAL Archive</title>
<meta name="theme-color" content="#141311">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TAL Archive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#141311; --surface:#1d1c19; --surface2:#26241f; --line:#33302a;
  --text:#ede8df; --muted:#9a948a; --faint:#6c675f;
  --accent:#e8b04b; --accent-ink:#141311; --done:#8fbf8f; --warn:#e6a35a;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --top: env(safe-area-inset-top,0px); --bot: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 var(--sans)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.hide{display:none!important}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--top) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:600 20px/1.1 var(--serif);letter-spacing:.2px}
.status{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.ok::before{content:"✓ ";color:var(--done)}
.status.warn{color:var(--warn)}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--surface2)}
.iconbtn.on{color:var(--accent)}

.search{margin-top:10px;position:relative}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;outline:none}
.search input:focus{border-color:var(--faint)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}

.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

.filters{display:flex;gap:8px;margin-top:8px;align-items:center}
.seg{flex:1;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{flex:1;padding:6px 0;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text);font-weight:600}
.sort{padding:6px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}

main{padding:10px 16px calc(var(--bot) + 140px)}
.summary{font-size:12px;color:var(--faint);margin:2px 0 8px;text-transform:uppercase;letter-spacing:.06em}

.cont{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:12px;margin-bottom:12px;width:100%;text-align:left}
.cont .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.cont .t{font:600 16px/1.25 var(--serif);margin:2px 0}
.cont .s{font-size:12px;color:var(--muted)}
.cont .go{flex:none;width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}

ul{list-style:none;margin:0;padding:0}
.ep{position:relative;display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 92px}
.ep .body{flex:1;min-width:0}
.ep .meta{font-size:12px;color:var(--faint);display:flex;gap:8px}
.ep .num{color:var(--muted);font-variant-numeric:tabular-nums}
.ep .title{font:600 17px/1.25 var(--serif);margin:2px 0 3px}
.ep .desc{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .bar{height:3px;background:var(--surface2);border-radius:2px;margin-top:8px;overflow:hidden}
.ep .bar i{display:block;height:100%;background:var(--accent)}
.ep .left{font-size:12px;color:var(--accent);margin-top:4px}
.ep .noaudio{font-size:12px;color:var(--faint);margin-top:4px}
.ep.played .title{color:var(--muted)}
.ep.playing .title{color:var(--accent)}
.ep.playing .num::after{content:" · now playing";color:var(--accent)}
.chk{flex:none;align-self:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent}
.ep.played .chk{background:var(--done);border-color:var(--done);color:var(--bg)}
.yearhdr{font:600 22px/1 var(--serif);color:var(--accent);padding:22px 0 6px;border-bottom:1px solid var(--line)}
.yearhdr:first-child{padding-top:6px}
.empty{color:var(--muted);text-align:center;padding:48px 12px;line-height:1.6}

.hist{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.hist .ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--surface2);color:var(--muted)}
.hist .ic.f{background:var(--done);color:var(--bg)}
.hist .t{font:600 15px/1.25 var(--serif)}
.hist .s{font-size:12px;color:var(--faint)}
.daylabel{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 2px}

#player{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(29,28,25,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 16px calc(var(--bot) + 10px)}
#seek{width:100%;margin:0;accent-color:var(--accent);height:24px}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:-2px}
.prow{display:flex;align-items:center;gap:6px;margin-top:4px}
.pinfo{flex:1;min-width:0;text-align:left}
.pinfo .pt{font:600 15px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo .ps{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn{width:40px;height:40px;display:grid;place-items:center;color:var(--text);border-radius:50%}
.pbtn:active{background:var(--surface2)}
.pbtn.main{width:48px;height:48px;background:var(--accent);color:var(--accent-ink)}
.speed{font-size:13px;font-weight:600;color:var(--muted);width:40px}
.perr{font-size:12px;color:var(--warn);margin-top:4px}
.perr a{color:var(--accent)}
.spin{width:20px;height:20px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(var(--bot) + 18px);max-height:85vh;overflow:auto}
.sheet h2{margin:0 0 12px;font:600 18px var(--serif)}
.sheet .row{padding:12px 0;border-bottom:1px solid var(--line)}
.sheet .row:last-child{border:0}
.sheet .lbl{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.sheet .val{font-size:14px}
.sheet .val.warn{color:var(--warn)}
.btn{display:inline-block;padding:10px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:14px;margin:6px 6px 0 0}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 140px);background:var(--surface2);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">
      <h1>TAL Archive</h1>
      <div id="status" class="status">Loading episodes…</div>
    </div>
    <button id="histBtn" class="iconbtn" aria-label="History">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
    </button>
    <button id="setBtn" class="iconbtn" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div id="browseCtl">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search titles, descriptions, #number" autocomplete="off">
    </div>
    <div id="years" class="chips"></div>
    <div class="filters">
      <div id="filter" class="seg">
        <button data-f="all">All</button>
        <button data-f="unplayed">Unplayed</button>
        <button data-f="progress">Started</button>
        <button data-f="played">Played</button>
      </div>
      <button id="sort" class="sort"></button>
    </div>
  </div>
</header>

<main>
  <div id="browse">
    <div id="cont"></div>
    <div id="summary" class="summary"></div>
    <ul id="list"></ul>
  </div>
  <div id="history" class="hide"></div>
</main>

<div id="player" class="hide">
  <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Position">
  <div class="times"><span id="tCur">0:00</span><span id="tLeft"></span></div>
  <div class="prow">
    <button id="pInfo" class="pinfo"><div id="pTitle" class="pt"></div><div id="pSub" class="ps"></div></button>
    <button id="back" class="pbtn" aria-label="Back 15 seconds"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.5" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="700">15</text></svg></button>
    <button id="pp" class="pbtn main" aria-label="Play"></button>
    <button id="fwd" class="pbtn" aria-label="Forward 30 seconds"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.5" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="700">30</text></svg></button>
    <button id="speed" class="pbtn speed" aria-label="Playback speed">1×</button>
  </div>
  <div id="pErr" class="perr hide"></div>
</div>

<div id="sheetBg" class="sheet-bg hide"></div>
<div id="sheet" class="sheet hide"></div>
<input id="importFile" type="file" accept="application/json,.json" class="hide">

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const KEY = "tal-archive-state-v1";
const ICON_PLAY = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
const ICON_PAUSE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1"/><rect x="13.5" y="4" width="4.5" height="16" rx="1"/></svg>';
const ICON_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const SPEEDS = [1, 1.25, 1.5, 1.75, 2];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// ---------- state (all on this phone) ----------
const blank = () => ({ v: 1, prog: {}, played: {}, log: [], last: null, prefs: { year: "all", filter: "all", sort: "asc", speed: 1 } });
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch { S = blank(); }
S.prefs = Object.assign(blank().prefs, S.prefs || {});
let storageOk = true;
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
  catch { storageOk = false; toast("Couldn't save your history on this phone — check storage space."); }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ---------- data ----------
let DATA = null, EPS = [], BY = {}, offline = false;
const yearOf = (e) => (e.d ? +e.d.slice(0, 4) : null);
function fmtDate(d) { if (!d) return ""; const [y, m, day] = d.split("-").map(Number); return `${MONTHS[m - 1]} ${day}, ${y}`; }
function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`;
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ago(iso) {
  const ms = Date.now() - new Date(iso).getTime(), d = Math.floor(ms / 864e5);
  if (d <= 0) return "today"; if (d === 1) return "yesterday"; return `${d} days ago`;
}

function status(n) {
  if (S.played[n]) return "played";
  const p = S.prog[n];
  if (p && p.p > 20) return "progress";
  return "unplayed";
}

async function load() {
  try {
    const r = await fetch("episodes.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
  } catch {
    offline = true;
    try { const c = await caches.match("episodes.json", { ignoreSearch: true }); if (c) DATA = await c.json(); } catch {}
  }
  if (!DATA) DATA = { episodes: [], updated: null, warnings: [] };
  EPS = DATA.episodes || [];
  BY = {}; EPS.forEach((e) => (BY[e.n] = e));
  renderStatus(); renderYears(); renderAll(); restorePlayer();
}

// ---------- status line (healthy state shown, problems announce themselves) ----------
function freshness() {
  if (!DATA.updated) return { warn: true, text: "Episode list is being built — first scan takes ~30 min" };
  const days = (Date.now() - new Date(DATA.updated).getTime()) / 864e5;
  if (offline) return { warn: true, text: `Offline · showing list saved ${ago(DATA.updated)}` };
  if (days > 9) return { warn: true, text: `List last updated ${ago(DATA.updated)} — auto-update needs attention` };
  if (DATA.warnings && DATA.warnings.length) return { warn: true, text: DATA.warnings[0] };
  return { warn: false, text: `${EPS.length} episodes · updated ${ago(DATA.updated)}` };
}
function renderStatus() {
  const f = freshness(), el = $("#status");
  el.textContent = f.text; el.className = "status " + (f.warn ? "warn" : "ok");
}

// ---------- filters ----------
function renderYears() {
  const ys = [...new Set(EPS.map(yearOf).filter(Boolean))].sort((a, b) => a - b);
  if (S.prefs.year !== "all" && !ys.includes(+S.prefs.year)) S.prefs.year = "all";
  $("#years").innerHTML = [`<button class="chip" data-y="all">All</button>`].concat(ys.map((y) => `<button class="chip" data-y="${y}">${y}</button>`)).join("");
  markChips();
  const on = $("#years .chip.on"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
}
function markChips() {
  document.querySelectorAll("#years .chip").forEach((c) => c.classList.toggle("on", c.dataset.y === String(S.prefs.year)));
  document.querySelectorAll("#filter button").forEach((b) => b.classList.toggle("on", b.dataset.f === S.prefs.filter));
  $("#sort").textContent = S.prefs.sort === "asc" ? "Oldest ↑" : "Newest ↓";
}
$("#years").addEventListener("click", (e) => {
  const c = e.target.closest(".chip"); if (!c) return;
  S.prefs.year = c.dataset.y === "all" ? "all" : +c.dataset.y; persist(); markChips(); renderList(true);
});
$("#filter").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  S.prefs.filter = b.dataset.f; persist(); markChips(); renderList(true);
});
$("#sort").addEventListener("click", () => { S.prefs.sort = S.prefs.sort === "asc" ? "desc" : "asc"; persist(); markChips(); renderList(true); });
let qt; $("#q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(() => renderList(true), 120); });

function visible() {
  const q = $("#q").value.trim().toLowerCase().replace(/^#/, "");
  const y = S.prefs.year, f = S.prefs.filter;
  let out = EPS.filter((e) => {
    if (y !== "all" && yearOf(e) !== +y) return false;
    if (f !== "all" && status(e.n) !== f) return false;
    if (q) {
      if (/^\d+$/.test(q)) return String(e.n).startsWith(q);
      return (e.t + " " + (e.desc || "")).toLowerCase().includes(q);
    }
    return true;
  });
  // Chronological by original air date (episode number breaks ties).
  const key = (e) => (e.d || "9999") + String(e.n).padStart(5, "0");
  out.sort((a, b) => (S.prefs.sort === "asc" ? (key(a) < key(b) ? -1 : 1) : (key(a) < key(b) ? 1 : -1)));
  return out;
}

// ---------- list ----------
function rowHTML(e) {
  const st = status(e.n), p = S.prog[e.n];
  let extra = "";
  if (!e.mp3) extra = `<div class="noaudio">Audio not available here · tap to open on their site</div>`;
  else if (p && p.p > 20 && p.d && !S.played[e.n]) {
    const pct = Math.min(100, (p.p / p.d) * 100);
    extra = `<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><div class="left">${Math.max(1, Math.round((p.d - p.p) / 60))} min left</div>`;
  }
  const cls = ["ep", st === "played" ? "played" : "", cur === e.n ? "playing" : ""].join(" ");
  return `<li class="${cls}" data-n="${e.n}">
    <div class="body">
      <div class="meta"><span class="num">#${e.n}</span><span>${esc(fmtDate(e.d))}</span></div>
      <div class="title">${esc(e.t)}</div>
      ${e.desc ? `<div class="desc">${esc(e.desc)}</div>` : ""}
      ${extra}
    </div>
    <button class="chk" data-act="toggle" aria-label="${st === "played" ? "Mark unplayed" : "Mark played"}">${ICON_CHECK}</button>
  </li>`;
}
function renderList(toTop) {
  const items = visible();
  const list = $("#list");
  if (!EPS.length) {
    list.innerHTML = `<div class="empty">The episode list is being built for the first time.<br>It takes about 30 minutes — then reopen the app.</div>`;
  } else if (!items.length) {
    list.innerHTML = `<div class="empty">Nothing here with these filters.</div>`;
  } else {
    // Year headings when browsing all years.
    let html = "", lastY = null;
    for (const e of items) {
      const y = yearOf(e);
      if (S.prefs.year === "all" && y !== lastY) { html += `<li class="yearhdr">${y || "Undated"}</li>`; lastY = y; }
      html += rowHTML(e);
    }
    list.innerHTML = html;
  }
  const scope = S.prefs.year === "all" ? "All years" : S.prefs.year;
  const all = EPS.filter((e) => S.prefs.year === "all" || yearOf(e) === +S.prefs.year);
  const nPlayed = all.filter((e) => S.played[e.n]).length;
  $("#summary").textContent = EPS.length ? `${scope} · ${items.length} shown · ${nPlayed} of ${all.length} played` : "";
  renderContinue();
  if (toTop) window.scrollTo({ top: 0 });
}
function updateRow(n) {
  const old = document.querySelector(`#list .ep[data-n="${n}"]`);
  if (!old || !BY[n]) return;
  const t = document.createElement("template"); t.innerHTML = rowHTML(BY[n]).trim(); old.replaceWith(t.content.firstChild);
}
$("#list").addEventListener("click", (e) => {
  const li = e.target.closest(".ep"); if (!li) return;
  const n = +li.dataset.n;
  if (e.target.closest('[data-act="toggle"]')) { togglePlayed(n); return; }
  play(n);
});

function inProgressList() {
  return Object.entries(S.prog)
    .filter(([n, p]) => BY[n] && p.p > 20 && (!p.d || p.p < p.d * 0.95))
    .sort((a, b) => b[1].t - a[1].t);
}
function renderContinue() {
  const box = $("#cont");
  const ip = inProgressList();
  const pick = ip.find(([n]) => +n === S.last) || ip[0];
  if (!pick || (cur && +pick[0] === cur)) { box.innerHTML = ""; return; }
  const n = +pick[0], p = pick[1], e = BY[n];
  box.innerHTML = `<button class="cont" data-n="${n}">
    <div style="flex:1;min-width:0"><div class="k">Continue listening</div><div class="t">${esc(e.t)}</div>
    <div class="s">#${n} · ${fmtTime(p.p)} in${p.d ? ` · ${Math.max(1, Math.round((p.d - p.p) / 60))} min left` : ""}</div></div>
    <span class="go">${ICON_PLAY}</span></button>`;
}
$("#cont").addEventListener("click", (e) => { const b = e.target.closest(".cont"); if (b) play(+b.dataset.n); });

function togglePlayed(n) {
  if (S.played[n]) { delete S.played[n]; logEvt(n, "u"); toast(`Marked #${n} unplayed`); }
  else { S.played[n] = Date.now(); logEvt(n, "f"); }
  persist();
  if (S.prefs.filter !== "all") renderList(); else { updateRow(n); renderList(false); }
  if (!$("#history").classList.contains("hide")) renderHistory();
}
function logEvt(n, a) {
  const last = S.log[S.log.length - 1];
  if (a === "s" && last && last.n === n && last.a === "s" && Date.now() - last.t < 6 * 3600e3) return;
  S.log.push({ n, a, t: Date.now() });
  if (S.log.length > 3000) S.log = S.log.slice(-3000);
}

// ---------- history ----------
function renderHistory() {
  const box = $("#history");
  const entries = S.log.filter((x) => BY[x.n] && x.a !== "u").slice().reverse().slice(0, 400);
  const played = Object.keys(S.played).length;
  let html = `<div class="summary">${played} played · ${inProgressList().length} started · ${EPS.length} total</div>`;
  if (!entries.length) html += `<div class="empty">Nothing yet. Episodes you start and finish show up here.</div>`;
  let day = "";
  for (const x of entries) {
    const d = new Date(x.t);
    const label = d.toDateString() === new Date().toDateString() ? "Today" : `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    if (label !== day) { html += `<div class="daylabel">${label}</div>`; day = label; }
    const e = BY[x.n], fin = x.a === "f";
    html += `<button class="hist" data-n="${x.n}"><span class="ic ${fin ? "f" : ""}">${fin ? "✓" : "▶"}</span>
      <span style="min-width:0"><div class="t">${esc(e.t)}</div><div class="s">#${x.n} · ${fin ? "Finished" : "Started"} ${d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</div></span></button>`;
  }
  box.innerHTML = html;
}
$("#history").addEventListener("click", (e) => { const b = e.target.closest(".hist"); if (b) play(+b.dataset.n); });
$("#histBtn").addEventListener("click", () => {
  const showing = $("#history").classList.toggle("hide") === false;
  $("#browse").classList.toggle("hide", showing);
  $("#browseCtl").classList.toggle("hide", showing);
  $("#histBtn").classList.toggle("on", showing);
  if (showing) renderHistory(); else renderList();
  window.scrollTo({ top: 0 });
});

// ---------- player ----------
const audio = new Audio();
audio.preload = "metadata";
let cur = null, shown = null, lastSave = 0, pendingSeek = null, dragging = false;
audio.playbackRate = S.prefs.speed;
$("#speed").textContent = S.prefs.speed + "×";

function showPlayer(n) {
  shown = n; const e = BY[n];
  $("#player").classList.remove("hide");
  $("#pTitle").textContent = e.t;
  $("#pSub").textContent = `#${n} · ${fmtDate(e.d)}`;
  const p = S.prog[n];
  if (cur !== n && p) { setSeekUI(p.p, p.d); }
  $("#pErr").classList.add("hide");
  setPP();
}
function restorePlayer() {
  const ip = inProgressList();
  const pick = ip.find(([n]) => +n === S.last) || ip[0];
  if (pick) showPlayer(+pick[0]);
}
function play(n) {
  const e = BY[n]; if (!e) return;
  if (!e.mp3) { window.open(e.url, "_blank", "noopener"); return; }
  if (cur === n) { audio.paused ? audio.play().catch(onErr) : audio.pause(); return; }
  savePos();
  const prev = cur;
  cur = n; S.last = n;
  const p = S.prog[n];
  pendingSeek = p && p.p > 20 && (!p.d || p.p < p.d - 15) ? Math.max(0, p.p - 3) : null;
  audio.src = e.mp3;
  audio.playbackRate = S.prefs.speed;
  audio.play().catch(onErr);
  logEvt(n, "s"); persist();
  showPlayer(n); setMedia(e);
  if (prev) updateRow(prev);
  updateRow(n); renderContinue();
}
function applyPendingSeek() {
  if (pendingSeek != null && audio.duration) {
    try { audio.currentTime = pendingSeek; pendingSeek = null; } catch {}
  }
}
audio.addEventListener("loadedmetadata", applyPendingSeek);
audio.addEventListener("canplay", applyPendingSeek);
audio.addEventListener("play", setPP);
audio.addEventListener("pause", () => { setPP(); savePos(); });
audio.addEventListener("waiting", () => setPP(true));
audio.addEventListener("playing", () => { setPP(); $("#pErr").classList.add("hide"); });
audio.addEventListener("timeupdate", () => {
  if (!cur) return;
  if (!dragging) setSeekUI(audio.currentTime, audio.duration);
  if (Date.now() - lastSave > 5000) savePos();
});
audio.addEventListener("ended", () => { finish(cur); setPP(); });
audio.addEventListener("error", onErr);
function onErr(err) {
  if (err && err.name === "NotAllowedError") { setPP(); return; } // needs a tap; not a failure
  if (err && err.name === "AbortError") return;
  if (!cur) return;
  const e = BY[cur];
  const el = $("#pErr");
  el.innerHTML = `This episode's audio didn't load. <a href="${esc(e.url)}" target="_blank" rel="noopener">Open it on their site</a> or try again.`;
  el.classList.remove("hide"); setPP();
}
function savePos() {
  if (!cur || !audio.currentTime) return;
  const d = audio.duration || (S.prog[cur] && S.prog[cur].d) || 0;
  const p = audio.currentTime;
  lastSave = Date.now();
  if (d && p >= d * 0.95) { finish(cur); return; }
  S.prog[cur] = { p, d, t: Date.now() };
  persist();
  updateRow(cur);
}
function finish(n) {
  if (!n) return;
  delete S.prog[n];
  if (!S.played[n]) { S.played[n] = Date.now(); logEvt(n, "f"); toast(`Finished #${n} — marked played`); }
  persist(); updateRow(n); renderContinue();
}
function setPP(loading) {
  const el = $("#pp");
  if (loading && !audio.paused) { el.innerHTML = '<span class="spin"></span>'; return; }
  const playing = cur && cur === shown && !audio.paused;
  el.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  el.setAttribute("aria-label", playing ? "Pause" : "Play");
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = playing ? "playing" : "paused";
}
function setSeekUI(p, d) {
  $("#tCur").textContent = fmtTime(p);
  $("#tLeft").textContent = d ? "−" + fmtTime(d - p) : "";
  $("#seek").value = d ? Math.round((p / d) * 1000) : 0;
}
$("#pp").addEventListener("click", () => {
  if (shown && cur !== shown) return play(shown);
  if (!cur) return;
  audio.paused ? audio.play().catch(onErr) : audio.pause();
});
const skip = (s) => { if (cur) audio.currentTime = Math.max(0, Math.min((audio.duration || 1e9) - 1, audio.currentTime + s)); };
$("#back").addEventListener("click", () => skip(-15));
$("#fwd").addEventListener("click", () => skip(30));
$("#speed").addEventListener("click", () => {
  const i = (SPEEDS.indexOf(S.prefs.speed) + 1) % SPEEDS.length;
  S.prefs.speed = SPEEDS[i]; audio.playbackRate = S.prefs.speed; persist();
  $("#speed").textContent = S.prefs.speed + "×";
});
const seek = $("#seek");
seek.addEventListener("input", () => {
  dragging = true;
  const d = cur === shown ? audio.duration : S.prog[shown] && S.prog[shown].d;
  if (d) { $("#tCur").textContent = fmtTime((seek.value / 1000) * d); $("#tLeft").textContent = "−" + fmtTime(d - (seek.value / 1000) * d); }
});
seek.addEventListener("change", () => {
  dragging = false;
  if (cur && cur === shown && audio.duration) { audio.currentTime = (seek.value / 1000) * audio.duration; savePos(); }
  else if (shown && S.prog[shown] && S.prog[shown].d) {
    S.prog[shown].p = (seek.value / 1000) * S.prog[shown].d; persist();
  }
});
$("#pInfo").addEventListener("click", () => {
  if (!shown) return;
  const row = document.querySelector(`#list .ep[data-n="${shown}"]`);
  if (row && !$("#browse").classList.contains("hide")) row.scrollIntoView({ block: "center", behavior: "smooth" });
});

function setMedia(e) {
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: e.t, artist: "This American Life", album: `#${e.n} · ${fmtDate(e.d)}`,
    artwork: [{ src: "icon-512.png", sizes: "512x512", type: "image/png" }],
  });
  const ms = navigator.mediaSession, h = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
  h("play", () => audio.play()); h("pause", () => audio.pause());
  h("seekbackward", () => skip(-15)); h("seekforward", () => skip(30));
  h("seekto", (d) => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
  h("previoustrack", null); h("nexttrack", null);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") savePos(); });
window.addEventListener("pagehide", savePos);

// ---------- settings sheet ----------
function openSheet() {
  const f = freshness();
  const played = Object.keys(S.played).length;
  $("#sheet").innerHTML = `<h2>Settings</h2>
    <div class="row"><div class="lbl">Episode list</div>
      <div class="val ${f.warn ? "warn" : ""}">${f.warn ? "" : "✓ "}${esc(f.text)}</div>
      ${DATA.updated ? `<div class="note">${EPS.length} episodes, ${DATA.withAudio ?? EPS.filter((e) => e.mp3).length} playable here. Checks for new episodes every Tuesday and Saturday.</div>` : ""}
      ${(DATA.warnings || []).slice(1).map((w) => `<div class="note" style="color:var(--warn)">${esc(w)}</div>`).join("")}
    </div>
    <div class="row"><div class="lbl">Your history (saved on this phone only)</div>
      <div class="val">${played} played · ${inProgressList().length} started${storageOk ? "" : ' · <span style="color:var(--warn)">not saving — storage full</span>'}</div>
      <button class="btn primary" id="exp">Save a backup</button><button class="btn" id="imp">Restore from backup</button>
      <div class="note">A backup is one small file. Keep it in Files or iCloud so a phone reset or cleared browser data doesn't wipe your history.</div>
    </div>
    <div class="row"><div class="note">Audio and episode info come from thisamericanlife.org. This is a personal index for easier browsing.</div></div>`;
  $("#sheet").classList.remove("hide"); $("#sheetBg").classList.remove("hide");
  $("#exp").onclick = exportBackup;
  $("#imp").onclick = () => $("#importFile").click();
}
function closeSheet() { $("#sheet").classList.add("hide"); $("#sheetBg").classList.add("hide"); }
$("#setBtn").addEventListener("click", openSheet);
$("#sheetBg").addEventListener("click", closeSheet);

async function exportBackup() {
  savePos();
  const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const blob = new Blob([JSON.stringify({ app: "tal-archive", v: 1, exported: d.toISOString(), state: S })], { type: "application/json" });
  const name = `tal-archive-backup-${stamp}.json`;
  const file = new File([blob], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "TAL Archive backup" }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
$("#importFile").addEventListener("change", async (ev) => {
  const f = ev.target.files[0]; ev.target.value = ""; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== "tal-archive" || !data.state) throw new Error("not a backup");
    const when = data.exported ? new Date(data.exported).toLocaleDateString() : "unknown date";
    if (!confirm(`Replace the history on this phone with the backup from ${when}?`)) return;
    audio.pause(); cur = null;
    S = Object.assign(blank(), data.state); S.prefs = Object.assign(blank().prefs, S.prefs || {});
    persist(); closeSheet(); renderYears(); renderAll(); restorePlayer();
    toast("Backup restored");
  } catch { toast("That file isn't a TAL Archive backup."); }
});

// ---------- misc ----------
let toastT;
function toast(msg) {
  let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
  el.textContent = msg; el.classList.remove("hide");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.add("hide"), 2600);
}
function renderAll() { markChips(); renderList(); }

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
load();
})();
</script>
</body>
</html>
